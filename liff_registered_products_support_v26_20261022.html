<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173d63">
  <title>ANABAS 登録商品・サポート</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root { --navy:#173d63; --blue:#2366ad; --ink:#17212b; --sub:#5e6d7d; --line:#dbe4ee; --paper:#fff; --base:#f4f7fa; --ok:#087d5b; --warn:#a85a00; --error:#b42318; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--base); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif; }
    main { max-width:680px; min-height:100vh; margin:0 auto; padding:24px 16px calc(32px + env(safe-area-inset-bottom)); }
    .brand { color:var(--navy); font-weight:800; font-size:13px; letter-spacing:.08em; }
    h1 { margin:8px 0 8px; font-size:26px; line-height:1.38; }
    .lead { margin:0 0 22px; color:var(--sub); font-size:14px; line-height:1.75; }
    .notice { margin:0 0 16px; padding:13px 14px; border-radius:12px; background:#eaf3ff; color:#1b4c83; font-size:13px; line-height:1.6; }
    .notice.error { background:#fff0ee; color:var(--error); }
    .list { display:grid; gap:12px; }
    .card { background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:0 4px 16px rgba(23,61,99,.05); }
    .card-head { display:flex; gap:12px; justify-content:space-between; align-items:flex-start; }
    .name { margin:0; font-size:18px; line-height:1.4; }
    .model,.meta { margin:4px 0 0; color:var(--sub); font-size:13px; line-height:1.55; }
    .badge { flex:0 0 auto; border-radius:999px; padding:6px 9px; background:#edf2f7; color:#48586a; font-size:12px; font-weight:700; white-space:nowrap; }
    .badge.active { background:#e6f6ef; color:var(--ok); }
    .badge.review { background:#fff3e4; color:var(--warn); }
    .badge.required,.badge.correction { background:#fff0ee; color:var(--error); }
    .details { margin-top:12px; padding-top:12px; border-top:1px solid var(--line); color:var(--sub); font-size:13px; line-height:1.65; }
    button { appearance:none; width:100%; border:0; border-radius:12px; padding:13px 15px; background:var(--navy); color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .secondary { margin-top:10px; background:#eaf0f6; color:var(--navy); }
    .quick-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
    .quick-actions button { margin:0; padding:11px 8px; background:#eaf0f6; color:var(--navy); font-size:13px; }
    .form { display:none; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
    .form.open { display:block; }
    label { display:block; margin:0 0 12px; color:var(--ink); font-size:13px; font-weight:700; }
    input,select { display:block; width:100%; margin-top:6px; padding:12px; border:1px solid #b7c4d1; border-radius:10px; background:#fff; color:var(--ink); font:inherit; font-size:16px; }
    .check { display:flex; gap:9px; align-items:flex-start; margin:4px 0 14px; color:var(--ink); font-size:13px; font-weight:400; line-height:1.6; }
    .check input { display:block; flex:0 0 auto; width:18px; height:18px; margin:2px 0 0; padding:0; }
    .step { margin:0 0 12px; padding:12px; border-radius:10px; background:#f7f9fb; color:var(--sub); font-size:13px; line-height:1.65; }
    .hidden { display:none !important; }
    .empty { padding:22px 18px; color:var(--sub); text-align:center; }
    .footer { margin:24px 0 0; color:var(--sub); font-size:12px; line-height:1.65; }
  </style>
</head>
<body>
  <main>
    <div class="brand">ANABAS SUPPORT</div>
    <h1>登録商品・サポート</h1>
    <p class="lead">登録済みの商品ごとに、保証状態の確認、取扱説明書、FAQ、修理受付を利用できます。</p>
    <div id="notice" class="notice">LINEアカウントを確認しています。</div>
    <section id="productList" class="list" aria-live="polite"></section>
    <p class="footer">保証登録時に画像の送信は不要です。レシート・納品書・注文履歴など購入証明は、修理時に確認するため保管してください。</p>
  </main>

  <script>
    // 新しく作成する「ANABAS 保証確認」LIFFアプリのIDへ差し替える。
    // 既存の商品登録LIFFとは別アプリにするため、現在の商品登録用LIFF IDは使わない。
    const CONFIG = Object.freeze({
      liffId: 'REPLACE_WITH_WARRANTY_LIFF_ID',
      webAppUrl: 'https://script.google.com/macros/s/AKfycbz_KUfbowQSUbkmTzpD7Vud0YCNPvNKSo1f-yTYVEtxM-GXaAY5U_OhLQKSynkMxFfTWQ/exec'
    });

    const state = { lineUserId:'', idToken:'', registrations:[], selectedQrToken:'', links:{} };
    const notice = document.getElementById('notice');
    const productList = document.getElementById('productList');

    function setNotice(message, isError) {
      notice.textContent = message;
      notice.classList.toggle('error', !!isError);
    }

    function esc(value) {
      return String(value == null ? '' : value).replace(/[&<>'"]/g, function(char) {
        return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[char];
      });
    }

    function statusClass(status) {
      return ({ active:'active', registered:'active', under_review:'review', evidence_required:'required', needs_correction:'correction' })[status] || '';
    }

    function getToday() {
      const now = new Date();
      const offset = now.getTimezoneOffset();
      return new Date(now.getTime() - offset * 60000).toISOString().slice(0, 10);
    }

    function safeDecode(value) {
      try { return decodeURIComponent(String(value || '').replace(/\+/g, ' ')); }
      catch (err) { return String(value || ''); }
    }

    function extractQrToken(value) {
      let text = String(value || '').trim();
      for (let i = 0; i < 3; i++) {
        const decoded = safeDecode(text);
        if (decoded === text) break;
        text = decoded;
      }
      const match = text.match(/(?:^|[?&#])qr_token=([^&#&]+)/);
      return match ? safeDecode(match[1]).trim() : '';
    }

    function getRequestedQrToken() {
      const params = new URLSearchParams(window.location.search);
      return String(params.get('qr_token') || '').trim()
        || extractQrToken(params.get('liff.state'))
        || extractQrToken(params.get('state'))
        || extractQrToken(window.location.hash || '');
    }

    function jsonp(action, parameters) {
      return new Promise(function(resolve, reject) {
        const callbackName = 'anabasWarrantyCallback_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
        const query = new URLSearchParams(Object.assign({}, parameters || {}, { action:action, callback:callbackName }));
        const script = document.createElement('script');
        let completed = false;
        const cleanup = function() {
          if (script.parentNode) script.parentNode.removeChild(script);
          try { delete window[callbackName]; } catch (err) { window[callbackName] = undefined; }
        };
        const timer = setTimeout(function() {
          if (completed) return;
          completed = true;
          cleanup();
          reject(new Error('通信がタイムアウトしました。'));
        }, 15000);
        window[callbackName] = function(payload) {
          if (completed) return;
          completed = true;
          clearTimeout(timer);
          cleanup();
          resolve(payload || {});
        };
        script.onerror = function() {
          if (completed) return;
          completed = true;
          clearTimeout(timer);
          cleanup();
          reject(new Error('通信に失敗しました。'));
        };
        script.src = CONFIG.webAppUrl + '?' + query.toString();
        document.head.appendChild(script);
      });
    }

    function apiParameters(extra) {
      return Object.assign({}, extra || {}, {
        line_user_id: state.lineUserId,
        id_token: state.idToken
      });
    }

    function renderProducts() {
      if (!state.registrations.length) {
        productList.innerHTML = '<section class="card empty">登録済みの商品がありません。製品または箱のQRから、先に商品登録してください。</section>';
        return;
      }

      productList.innerHTML = state.registrations.map(function(item, index) {
        const product = item.product || {};
        const warranty = item.warranty || {};
        const canApply = ['not_requested', 'needs_correction', 'registered'].indexOf(warranty.status) >= 0;
        const selected = state.selectedQrToken === item.qr_token && canApply;
        const warrantyDates = warranty.status === 'active' && warranty.warranty_start_date
          ? '<div>保証期間：' + esc(warranty.warranty_start_date) + ' ～ ' + esc(warranty.warranty_end_date || '確認中') + '</div>'
          : '';
        const purchaseDetails = warranty.purchase_date
          ? '<div>申告した購入日：' + esc(warranty.purchase_date) + '</div><div>購入先：' + esc(warranty.retailer_name || '-') + '</div>'
            + (warranty.purchase_channel === 'online' ? '<div>注文番号：' + esc(warranty.order_number || '-') + '</div>' : '')
          : '';
        const reason = warranty.status === 'needs_correction' && warranty.rejection_reason
          ? '<div>確認事項：' + esc(warranty.rejection_reason) + '</div>'
          : '';
        return '<section class="card">'
          + '<div class="card-head"><div><h2 class="name">' + esc(product.product_name || '-') + '</h2><p class="model">型番：' + esc(product.model_number || '-') + '</p></div>'
          + '<span class="badge ' + statusClass(warranty.status) + '">' + esc(warranty.status_label || '確認中') + '</span></div>'
          + '<div class="details"><div>製品登録日：' + esc(item.registered_at || '-') + '</div>'
          + purchaseDetails + warrantyDates + reason + '</div>'
          + '<div class="quick-actions">'
          + '<button type="button" data-open-manual="' + index + '">取扱説明書</button>'
          + '<button type="button" data-open-faq="' + index + '">FAQを質問</button>'
          + '<button type="button" data-open-repair="' + index + '">修理受付</button>'
          + '<button type="button" data-open-warranty="' + index + '">保証の確認</button>'
          + '</div>'
          + (canApply ? '<button type="button" data-open-form="' + index + '">' + (warranty.status === 'registered' ? '登録内容を変更する' : '保証登録する') + '</button>' : '')
          + '<div class="form ' + (selected ? 'open' : '') + '" id="form-' + index + '">'
          + '<p class="step">購入情報を登録してください。レシート・納品書・注文履歴などの購入証明は送信せず、修理時まで保管してください。</p>'
          + '<label>購入日<input type="date" id="purchase-date-' + index + '" max="' + getToday() + '" value="' + esc(warranty.purchase_date || '') + '"></label>'
          + '<label>販売店名・ストア名<input type="text" id="retailer-' + index + '" maxlength="120" placeholder="例：○○オンラインストア、○○家電" value="' + esc(warranty.retailer_name || '') + '"></label>'
          + '<label>購入方法<select id="channel-' + index + '"><option value="">選択してください</option><option value="online">オンラインストア・モール</option><option value="store">店頭・レシート購入</option></select></label>'
          + '<label class="hidden" id="order-wrap-' + index + '">注文番号<input type="text" id="order-number-' + index + '" maxlength="120" autocomplete="off" placeholder="注文履歴に表示される番号" value="' + esc(warranty.order_number || '') + '"></label>'
          + '<label class="check"><input type="checkbox" id="proof-retention-' + index + '"><span>レシート・納品書・注文履歴などの購入証明を保管し、修理時に提出が必要になることを確認しました。</span></label>'
          + '<button type="button" data-submit-form="' + index + '">保証登録する</button>'
          + '</div></section>';
      }).join('');

      state.registrations.forEach(function(item, index) {
        const channel = document.getElementById('channel-' + index);
        if (channel && item.warranty && item.warranty.purchase_channel) channel.value = item.warranty.purchase_channel;
        if (channel) {
          channel.addEventListener('change', function() { toggleOrderInput(index); });
          toggleOrderInput(index);
        }
      });

      Array.prototype.forEach.call(document.querySelectorAll('[data-open-form]'), function(button) {
        button.addEventListener('click', function() {
          const item = state.registrations[Number(button.dataset.openForm)];
          state.selectedQrToken = item.qr_token;
          renderProducts();
        });
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-open-warranty]'), function(button) {
        button.addEventListener('click', function() {
          const index = Number(button.dataset.openWarranty);
          const item = state.registrations[index];
          if (!item) return;
          state.selectedQrToken = item.qr_token;
          renderProducts();
          const form = document.getElementById('form-' + index);
          if (form) form.scrollIntoView({ behavior:'smooth', block:'start' });
        });
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-open-manual]'), function(button) {
        button.addEventListener('click', function() {
          const item = state.registrations[Number(button.dataset.openManual)] || {};
          const url = item.product && item.product.manual_url;
          if (!url) { setNotice('この商品の取扱説明書URLは準備中です。', true); return; }
          liff.openWindow({ url:url, external:true });
        });
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-open-repair]'), function(button) {
        button.addEventListener('click', function() { openRepair(Number(button.dataset.openRepair)); });
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-open-faq]'), function(button) {
        button.addEventListener('click', function() { openFaq(Number(button.dataset.openFaq)); });
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-submit-form]'), function(button) {
        button.addEventListener('click', function() { submitWarrantyForm(Number(button.dataset.submitForm)); });
      });
    }

    function toggleOrderInput(index) {
      const channel = document.getElementById('channel-' + index);
      const orderWrap = document.getElementById('order-wrap-' + index);
      const orderInput = document.getElementById('order-number-' + index);
      if (!channel || !orderWrap || !orderInput) return;
      const isOnline = channel.value === 'online';
      orderWrap.classList.toggle('hidden', !isOnline);
      orderInput.required = isOnline;
      if (!isOnline) orderInput.value = '';
    }

    async function loadWarrantyProducts() {
      setNotice('登録商品の保証状態を確認しています。');
      const result = await jsonp('get_warranty_products', apiParameters());
      if (!result.ok) throw new Error(result.error || '保証情報を取得できませんでした。');
      state.registrations = Array.isArray(result.registrations) ? result.registrations : [];
      renderProducts();
      setNotice('保証状態を確認できます。');
    }

    async function loadLinks() {
      const result = await jsonp('get_liff_links', {});
      if (result && result.ok) state.links = result;
    }

    function withQrToken(url, qrToken) {
      if (!url) return '';
      return url + (url.indexOf('?') >= 0 ? '&' : '?') + 'qr_token=' + encodeURIComponent(qrToken);
    }

    function openRepair(index) {
      const item = state.registrations[index];
      const url = withQrToken(state.links.repair_liff_url, item && item.qr_token);
      if (!url) { setNotice('修理受付画面の準備ができていません。', true); return; }
      window.location.href = url;
    }

    async function openFaq(index) {
      const item = state.registrations[index];
      if (!item) return;
      try {
        const result = await jsonp('select_product_context', apiParameters({ qr_token:item.qr_token }));
        if (!result.ok) throw new Error(result.error || '対象商品を設定できませんでした。');
        window.location.href = 'https://line.me/R/ti/p/%40227revut';
      } catch (err) {
        setNotice('FAQを開けませんでした。' + String(err.message || err), true);
      }
    }

    async function submitWarrantyForm(index) {
      const item = state.registrations[index];
      const purchaseDate = document.getElementById('purchase-date-' + index).value;
      const retailerName = document.getElementById('retailer-' + index).value.trim();
      const purchaseChannel = document.getElementById('channel-' + index).value;
      const orderNumber = document.getElementById('order-number-' + index).value.trim();
      const proofRetentionConfirmed = document.getElementById('proof-retention-' + index).checked;
      if (!purchaseDate || !retailerName || !purchaseChannel) {
        setNotice('購入日、販売店名・ストア名、購入方法を入力してください。', true);
        return;
      }
      if (purchaseChannel === 'online' && !orderNumber) {
        setNotice('オンライン購入の場合は注文番号を入力してください。', true);
        return;
      }
      if (!proofRetentionConfirmed) {
        setNotice('購入証明を保管することへの確認にチェックしてください。', true);
        return;
      }
      const button = document.querySelector('[data-submit-form="' + index + '"]');
      button.disabled = true;
      setNotice('購入情報を送信しています。');
      try {
        const result = await jsonp('submit_warranty_request', apiParameters({
          qr_token:item.qr_token,
          purchase_date:purchaseDate,
          retailer_name:retailerName,
          purchase_channel:purchaseChannel,
          order_number:orderNumber,
          proof_retention_confirmed:String(proofRetentionConfirmed)
        }));
        if (!result.ok) throw new Error(result.error || '送信できませんでした。');
        state.selectedQrToken = '';
        state.selectedQrToken = getRequestedQrToken();
        await Promise.all([loadLinks(), loadWarrantyProducts()]);
        setNotice('保証登録が完了しました。購入証明は修理時まで保管してください。');
      } catch (err) {
        button.disabled = false;
        setNotice(String(err.message || err), true);
      }
    }

    async function init() {
      if (!CONFIG.liffId || CONFIG.liffId.indexOf('REPLACE_WITH') === 0) {
        setNotice('保証確認用LIFF IDが未設定です。公開前にHTMLのCONFIG.liffIdを設定してください。', true);
        return;
      }
      try {
        await liff.init({ liffId:CONFIG.liffId, withLoginOnExternalBrowser:true });
        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri:window.location.href });
          return;
        }
        const profile = await liff.getProfile();
        state.lineUserId = profile.userId || '';
        state.idToken = liff.getIDToken() || '';
        if (!state.lineUserId) throw new Error('LINEアカウントを確認できませんでした。');
        await loadWarrantyProducts();
      } catch (err) {
        setNotice(String(err.message || err), true);
      }
    }

    init();
  </script>
</body>
</html>
